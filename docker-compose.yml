version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: container_ingressos
    restart: always
    ports:
      - "2222:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: senha123
      POSTGRES_DB: db_ingressos
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: container_rabbitmq
    ports:
      - "5672:5672"      # conexão AMQP (para suas apps)
      - "15672:15672"    # painel de administração (opcional)
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: senha123

  paymentapp:
    build: backend/paymentapp
    container_name: container_paymentapp
    restart: always
    ports:
      - "3001:3000"
    depends_on:
      - rabbitmq
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: admin
      DB_PASSWORD: senha123
      DB_NAME: db_ingressos
      RABBITMQ_URL: amqp://rabbitmq:5672

  ticketapp:
    build: backend/ticketapp
    container_name: container_tickets
    restart: always
    ports:
      - "3002:3000"
    depends_on:
      - rabbitmq
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: admin
      DB_PASSWORD: senha123
      DB_NAME: db_ingressos
      RABBITMQ_URL: amqp://rabbitmq:5672

  pgadmin:
    image: dpage/pgadmin4
    container_name: container_pgadmin
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    depends_on:
      - postgres

volumes:
  pgdata:

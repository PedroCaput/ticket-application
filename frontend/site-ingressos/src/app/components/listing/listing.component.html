<div class="event-grid">
  <a
    *ngFor="let e of events"
    [routerLink]="['/detalhes', slugify(e.name)]"
    class="event-card"
  >
    <img [src]="e.photo" [alt]="e.name" />
    <div class="event-info">
      <div class="date-time">
        <span>{{ e.date | date: 'dd/MM/yyyy' }} – {{ e.hour }}</span><br />
        <span>Abertura: {{ e.hour }}</span><br />
        <span>Censura: {{ e.mininumAge }}+</span>
      </div>
      <div class="city">{{ e.city }} – {{ e.state }}</div>
      <div class="venue">{{ e.houseName }}</div>
      <div class="title">{{ e.name }}</div>
    </div>
  </a>
</div>
